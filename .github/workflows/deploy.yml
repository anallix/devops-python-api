name: Deploy na AWS


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  CONTAINER_NAME: devops-python-api
  HOST_PORT: 80 
  CONTAINER_PORT: 8000 

jobs:

  tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Executar testes
        run: pytest --cov=app

  build-and-push:
    name: Build e push para o ECR
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir o nome da imagem (tag = SHA do commit)
        id: image
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Construir a imagem
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --tag ${{ steps.image.outputs.image }} \
            --tag ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Enviar a imagem para o ECR
        run: |
          docker push ${{ steps.image.outputs.image }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest


  deploy:
    name: Deploy na EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}/health

    steps:
      - name: Atualizar o container na EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,REGISTRY,AWS_REGION,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT
          script: |
            set -e
            echo ">> Login no ECR (permissão vem da IAM Role da instância)"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            echo ">> Baixando a imagem $IMAGE"
            docker pull "$IMAGE"

            echo ">> Removendo o container anterior, se existir"
            docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

            echo ">> Iniciando a nova versão"
            docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish "$HOST_PORT:$CONTAINER_PORT" \
              "$IMAGE"

            echo ">> Verificando se a API respondeu"
            for attempt in $(seq 1 20); do
              if curl --fail --silent "http://127.0.0.1:$HOST_PORT/health"; then
                echo
                docker ps --filter "name=$CONTAINER_NAME"
                docker image prune --all --force --filter "until=24h" > /dev/null || true
                echo ">> Deploy concluído com sucesso"
                exit 0
              fi
              echo "Tentativa $attempt: API ainda não está pronta"
              sleep 2
            done
            echo "!! A API não respondeu ao health check"
            docker logs "$CONTAINER_NAME" || true
            exit 1


  smoke-test:
    name: Verificar API publicada
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Chamar o /health pela internet
        run: curl --fail --silent --show-error "http://${{ vars.EC2_HOST }}/health"